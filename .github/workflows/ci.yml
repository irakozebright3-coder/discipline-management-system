name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in $(find src -name '*.js'); do node --check "$f"; done
      - name: Boot check
        run: |
          SUPABASE_URL=https://dummy.supabase.co \
          SUPABASE_ANON_KEY=dummy \
          SUPABASE_SERVICE_ROLE_KEY=dummy \
          PORT=4999 node src/index.js &
          for i in $(seq 1 20); do curl -sf http://localhost:4999/health && break || sleep 1; done > /dev/null
          HEALTH=$(curl -sf http://localhost:4999/health)
          echo "$HEALTH" | grep -q '"ok":true' || (echo "health check failed" && exit 1)
          GUARD=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4999/api/persons)
          [ "$GUARD" = "401" ] || (echo "expected 401 without token, got $GUARD" && exit 1)

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
